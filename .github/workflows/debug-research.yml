name: Debug research feed (one-off)
on:
  push:
    branches: [debug/research-feed]
    paths: [debug/research_probe.py, .github/workflows/debug-research.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip show anthropic | head -2
      - name: Probe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m debug.research_probe
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add debug/out && git commit -m "probe output" && git push
