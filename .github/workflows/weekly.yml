name: Weekly capex early-warning

on:
  schedule:
    # Saturdays 01:17 UTC = 09:17 Shanghai / Singapore time
    - cron: "17 1 * * 6"
    # Daily 23:30 UTC = 07:30 UTC+8: runs only if a config/events.yaml event fell on the US day just
    # ending and no run happened that day (cew/events.py; keep EVENT_CHECK_CRON in sync)
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      event:
        description: "Tag as an event run, e.g. MSFT-earnings (names from config/events.yaml; blank = normal manual run)"
        type: string
        required: false
        default: ""
      research_model:
        description: "Research model (blank = RESEARCH_MODEL variable, then config)"
        type: string
        required: false
        default: ""
      assessment_model:
        description: "Scoring & digest model (blank = ASSESSMENT_MODEL variable, then config)"
        type: string
        required: false
        default: ""
      send_email:
        description: "Send the digest email"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: weekly-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # the first v2 run also reads two lease footnotes per company
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 3.13's stricter TLS checks reject the TWSE certificate
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Decide whether to run
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_EVENT: ${{ inputs.event }}
          AUTO_RUNS: ${{ vars.AUTO_RUNS }}   # set from the dashboard: all | weekly | events | off
        run: python -m cew.events plan

      - name: Unit tests
        if: steps.plan.outputs.run == 'true'
        run: python -m pytest -q tests   # capex tests only: stock-module tests (tests_stocks) never block this run

      - name: Run pipeline
        if: steps.plan.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # Inputs reach the script only through env, never as expressions inside run:, so they cannot inject shell.
          EVENT_NAME: ${{ github.event_name }}
          RUN_TRIGGER: ${{ steps.plan.outputs.trigger }}
          INPUT_SEND_EMAIL: ${{ inputs.send_email }}
          INPUT_RESEARCH_MODEL: ${{ inputs.research_model }}
          INPUT_ASSESSMENT_MODEL: ${{ inputs.assessment_model }}
          VAR_RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          VAR_ASSESSMENT_MODEL: ${{ vars.ASSESSMENT_MODEL }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_SEND_EMAIL" = "false" ]; then
            python -m cew.run --no-email
          else
            python -m cew.run
          fi

      - name: Save data and dashboard files
        if: always() && steps.plan.outputs.run == 'true'
        env:
          RUN_TRIGGER: ${{ steps.plan.outputs.trigger }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Data update $(date -u +%Y-%m-%d) (${RUN_TRIGGER:-manual})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
