# Dated events that trigger an extra "event-day" run.
# A daily check at 23:30 UTC (07:30 UTC+8) runs the full pipeline when an event below fell on the
# US Eastern calendar day that is just ending, unless a run already happened that day.
#
# date      US Eastern calendar date of the release or decision (TSMC reports at 14:00 Taipei,
#           which is early morning of the same date in New York).
# name      tag used in the run trigger, e.g. "event:MSFT-earnings" (letters, digits, "." and "-").
# type      fomc | cpi | earnings. Earnings for a ticker listed under `hyperscalers` in
#           signals.yaml also pull the earnings press release (8-K Item 2.02, Exhibit 99.1) from EDGAR.
# verified  true only if the date was seen on the official source (federalreserve.gov, bls.gov, or
#           the company's own investor-relations site / newsroom): on a page opened directly, or on
#           at least two official pages that agree. Dates from a single official page seen only in
#           a search summary, third-party calendars or last year's pattern are verified: false.
#           Re-check unverified dates when the company announces them.
# Checked on 2026-10-13. Add the 2027 dates before the end of the year (the run log warns 30 days ahead).

events:
