# Claude prices used for the per-run cost estimate (USD, Anthropic first-party API list prices).
# input / output: $ per million tokens. web_search_per_1k: $ per 1,000 web searches.
# Models the API lists but that are missing here still appear in the dashboard, just without a price.
# This list is also the fallback model list when the Anthropic Models API can't be reached.

web_search_per_1k: 10.0

models:
  claude-fable-5-1: {name: "Claude Fable 5.1", input: 10.0, output: 50.0}
  claude-opus-5-5: {name: "Claude Opus 5.5", input: 4.0, output: 20.0}
  claude-sonnet-5-5: {name: "Claude Sonnet 5.5", input: 2.0, output: 10.0}
  # Tiered: $0.10 / $0.50 for prompts up to 100K input tokens, $0.50 / $2.50 for a request whose prompt
  # (input + cache write + cache read tokens) is above that. The stock module prices each request by its
  # tier (cew.models.cost_summary_tiered); the capex pipeline's cost estimate uses the base price.
  claude-haiku-5-5: {name: "Claude Haiku 5.5", input: 0.10, output: 0.50, verify: true,
                     tiers: [{above_input_tokens: 100000, input: 0.50, output: 2.50}]}
