# Stock research configuration (the on-demand module in stocks/; separate from the capex pipeline).
# Every threshold and weight lives here; no code changes needed to retune.
#
# Six factors are scored 0-100. Five are computed by code from SEC filings, prices and the 10-year
# Treasury yield; "news_risk" comes from Claude's reading of the last 30 days of news, rated per topic
# against the fixed rubric below and turned into 0-100 by code. The composite is the weighted average of
# the factors that had data (weights re-normalised when one is missing).
#
# Sub-metric scores use "points": [[x, score], ...] sorted by x. A value between two points is
# interpolated linearly; below the first or above the last it takes that end's score.

models:
  research: claude-sonnet-5-5   # web-search news research
  scoring: claude-opus-5-5      # news topic ratings, the write-up, and guidance extraction from the 8-K
# A run's models come from the workflow_dispatch inputs (the stocks page's dropdowns), else the values
# above. Prices for the cost estimate are in config/models.yaml (shared with the capex pipeline).
max_web_searches: 8
news_window_days: 30

prices:
  provider: tiingo              # end-of-day prices; key in the STOCK_PRICE_API_KEY secret
  years: 5
  benchmarks: [SPY, QQQ]         # fetched once per batch by the plan job and shared with every ticker's job
  # Near-live quote, display only (never a score input; factors use the latest official daily close):
  # Tiingo IEX tngoLast, which becomes the official close once that prints. ONE request for all tickers
  # (iex/?tickers=a,b,c); above quotes_max_tickers, or if that form fails, the all-tickers endpoint
  # (iex, about 10 MB) filtered in code. Never one request per ticker.
  quotes_max_tickers: 100

# The stocks page's list view and batch runs
page:
  stale_after_days: 14          # a rating older than this shows a "stale" tag in the list view
batch:
  max_batch: 15                 # tickers per run (the plan job and site/api/stock.js both enforce it)
  max_tickers_per_day: 30       # tickers across stocks.yml runs in any 24 hours (site/api/stock.js counts them)
  max_rescore_tickers_per_day: 30   # reuse_news re-scores (write-up only, ~$0.03 a ticker), counted apart from the above
  max_parallel: 5               # ticker jobs at once (matrix max-parallel)
# Lists live in the STOCK_LISTS repo Actions variable ({version, lists: [{id, name, tickers}]}), saved
# whole by site/api/stock.js, which enforces these limits (GitHub's limit for one variable is 48 KB).
lists:
  max_lists: 30
  max_tickers_per_list: 100
  max_bytes: 40000              # compact JSON

factors:
  weights:
    growth: 0.20
    quality: 0.20
    balance_sheet: 0.10
    valuation: 0.20
    trend: 0.15
    news_risk: 0.15
  # A factor counts as "had data" when sub-metrics carrying at least this share of its sub-weights had
  # values; otherwise it is marked missing and drops out of the composite.
  min_coverage: 0.5

growth:
  revenue_yoy_q:                # latest quarter's revenue vs the same quarter a year earlier (%)
    weight: 0.45
    points: [[-10, 0], [0, 25], [10, 55], [20, 75], [35, 95], [50, 100]]
  revenue_yoy_ttm:              # trailing-twelve-month revenue vs the TTM a year earlier (%)
    weight: 0.30
    points: [[-10, 0], [0, 25], [10, 55], [20, 75], [35, 95], [50, 100]]
  acceleration_pp:              # latest quarter's YoY growth minus the previous quarter's (pct points)
    weight: 0.25
    points: [[-10, 0], [-5, 25], [0, 50], [5, 75], [10, 100]]

quality:
  gross_margin_pct:             # TTM
    weight: 0.20
    points: [[10, 0], [25, 25], [40, 50], [60, 75], [75, 100]]
  operating_margin_pct:         # TTM
    weight: 0.25
    points: [[-10, 0], [0, 20], [15, 55], [30, 85], [45, 100]]
  fcf_margin_pct:               # TTM free cash flow (operating cash flow minus capex) / revenue; ex-prepayments
    weight: 0.25                # or normalised when that applies (prepayments, fcf_spike, below)
    points: [[-10, 0], [0, 20], [10, 50], [25, 85], [40, 100]]
  sbc_pct_revenue:              # TTM stock-based compensation / revenue; lower is better
    weight: 0.15
    points: [[2, 100], [5, 80], [10, 50], [20, 15], [30, 0]]
  dilution_yoy_pct:             # diluted share count vs a year earlier (%); buybacks are negative
    weight: 0.15
    points: [[-3, 100], [0, 75], [2, 50], [5, 20], [10, 0]]
# Gross profit falls back to revenue minus cost of revenue (CostOfRevenue, CostOfGoodsAndServicesSold,
# CostOfServices, ...) and operating income to revenue minus CostsAndExpenses, else gross profit minus
# OperatingExpenses, period by period, when the company doesn't tag them. A margin still missing shows as
# "missing" in the factor's inputs.

# Which FCF quality and valuation (P/FCF, FCF yield and the P/FCF history) are scored on. The reported FCF
# is always shown too, and either adjustment flags it and steps confidence down; when both apply, the lower
# FCF is scored. The balance-sheet factor keeps the reported FCF.
#
# Excess prepayments: excess = the TTM increase in contract liabilities / deferred revenue / customer
# advances (the cash-flow statement's change lines, else the balance sheet's change over the year) minus
# (their balance a year earlier x TTM revenue growth), so deferred revenue growing with sales doesn't count.
# When the excess exceeds max_share_of_ocf of TTM operating cash flow (any positive excess when that is zero
# or negative), FCF minus the excess is scored ("FCF ex-prepayments"). No balance a year earlier: not applied.
prepayments:
  max_share_of_ocf: 0.25

# FCF spike guard (needs no tag): when any of the last 4 quarters has FCF above quarter_fcf_to_revenue x that
# quarter's revenue, or the TTM FCF margin is more than margin_jump_x times the TTM margin a year earlier and
# above margin_jump_min_pct, FCF is scored as the median quarterly FCF margin of the last median_quarters
# quarters x TTM revenue ("normalised FCF"; needs min_quarters of them), flagged "FCF spike (cause not in
# tagged data)".
fcf_spike:
  quarter_fcf_to_revenue: 1.0
  margin_jump_x: 2.0
  margin_jump_min_pct: 30
  median_quarters: 8
  min_quarters: 4

balance_sheet:
  # A figure is UNKNOWN (balance sheet, EV and EV/EBIT then count as missing, with a note) when a tag of its
  # group had a non-zero value in the last stopped_tag_quarters quarters and nothing covers the latest
  # balance-sheet date, or only tags we don't read carry a value. Debt is zero ("no debt") only when no
  # debt tag had a non-zero value in the last no_debt_quarters quarters. Tag lists: stocks/fundamentals.py.
  stopped_tag_quarters: 4
  no_debt_quarters: 8
  # Net debt / TTM FCF in years. Net cash (net debt <= 0) with positive FCF scores 100; positive net debt
  # with FCF <= 0 scores 0; net cash with negative FCF is scored on runway (cash / annual burn, below).
  net_debt_to_fcf:
    weight: 0.6
    points: [[0, 100], [1, 85], [2, 70], [4, 40], [6, 15], [8, 0]]
  runway_years:                 # used instead of net_debt_to_fcf when FCF is negative and there is net cash
    points: [[0.5, 0], [1, 20], [2, 50], [4, 80], [6, 100]]
  cash_to_debt:                 # cash + short-term investments / total debt (no debt scores 100)
    weight: 0.4
    points: [[0, 0], [0.25, 30], [0.5, 50], [1, 80], [2, 100]]

valuation:
  # Market cap = latest close x shares; EV = market cap + debt - cash and short-term investments (leases
  # excluded). Multiples use TTM figures. A negative FCF or EBIT scores 0 on that multiple.
  price_to_sales:
    weight: 0.10
    points: [[1, 100], [3, 75], [6, 50], [12, 25], [25, 0]]
  price_to_fcf:
    weight: 0.15
    points: [[10, 100], [20, 70], [35, 40], [60, 10], [80, 0]]
  ev_to_ebit:
    weight: 0.15
    points: [[8, 100], [15, 70], [25, 45], [40, 15], [60, 0]]
  fcf_yield_vs_10y_pp:          # FCF yield minus the 10-year Treasury yield (data/fred/DGS10.csv), pct points
    weight: 0.20
    points: [[-4, 0], [-2, 25], [0, 50], [2, 75], [4, 100]]
  # Each multiple versus the company's own month-end history: the share of month-ends that were cheaper
  # than now (score = 100 - that share, so cheaper than usual scores higher). Ranked on yields (sales / FCF
  # / EBIT over market cap or EV). History uses only the filings known on each date.
  price_to_sales_percentile: {weight: 0.10}
  price_to_fcf_percentile: {weight: 0.15}
  ev_to_ebit_percentile: {weight: 0.15}
  # P/FCF and EV/EBIT are compared with their history only when FCF / EBIT is positive now and was zero or
  # negative in at most this share of the month-ends. Otherwise the comparison is "not comparable (negative
  # in 36 of 61 month-ends)": left out of the valuation score (the other inputs' weights re-normalised), out
  # of the cheap / middle / expensive label, and the write-up gets that phrase instead. (A company that just
  # turned profitable would otherwise be "cheaper than at every month-end".) P/S is always compared.
  history_max_negative_share: 0.2
  # The write-up gets this comparison in words, never as a percentile (stocks/wording.py): a multiple is
  # "cheap" vs its own history when fewer than cheap_below % of the month-ends were cheaper than now
  # ("cheaper than at 58 of the last 61 month-ends"), "expensive" when more than expensive_above % were
  # ("more expensive than at 57 of the last 61 month-ends"), else "near the middle". The overall label
  # (cheap / middle / expensive) uses the average of the compared multiples' shares, weighted as above.
  history_label:
    cheap_below: 33
    expensive_above: 67
  history_years: 5
  min_history_points: 24        # fewer month-end points than this: percentile left out
  share_outlier_x: 10           # a diluted share count more than this many times off the median of its
                                # neighbours (two before and two after, both sides) is dropped, with a note

trend:
  # From split- and dividend-adjusted daily closes.
  vs_ma50_pct:
    weight: 0.15
    points: [[-10, 0], [-5, 25], [0, 50], [5, 75], [10, 100]]
  vs_ma200_pct:
    weight: 0.20
    points: [[-20, 0], [-10, 25], [0, 50], [10, 75], [20, 100]]
  momentum_12_1_pct:            # return from 12 months ago to 1 month ago
    weight: 0.25
    points: [[-30, 0], [-10, 25], [0, 45], [15, 70], [40, 100]]
  rs_spy_pp:                    # return over rs_days minus SPY's (pct points)
    weight: 0.125
    points: [[-30, 0], [-10, 30], [0, 50], [10, 70], [30, 100]]
  rs_qqq_pp:
    weight: 0.125
    points: [[-30, 0], [-10, 30], [0, 50], [10, 70], [30, 100]]
  drawdown_52w_pct:             # close vs the 52-week high
    weight: 0.15
    points: [[-40, 0], [-25, 25], [-10, 60], [-3, 90], [0, 100]]
  rs_days: 126                  # about 6 months of trading days

# News & risk: Claude rates each topic -2..+2 on this rubric (the prompt quotes it); code turns the
# ratings into 0-100: 50 + sum(weight x rating x points_per_step). All zero = 50.
#   +2  clear, material positive news from at least two credible sources
#   +1  modest or single-source positive news
#    0  nothing material, or mixed
#   -1  modest or single-source negative news
#   -2  clear, material negative news from at least two credible sources
# Only in-window evidence counts toward these caps: a source that was verified or unreachable AND is dated
# inside the window (an event date no more than evidence_dates.background_after_days before the run;
# undated or older items count for nothing). After the source check a topic's rating can't exceed (in size)
# the number of its in-window sources: one -> at most +-1 (no checkable source at all -> 0). Then source
# quality (below; tiers from source_tiers; the strong-tier sources it counts must be in-window too): the
# topic keeps the lower of the two caps, and the stocks page and email show "capped: weak sources" when the
# quality rule lowered it. Then evidence dates: with no in-window source, the rating is capped at 0, shown
# as "capped: only older evidence". Then direction: Claude labels each item positive / negative / neutral,
# and an item supports a rating only when it points the rating's way (positive for +, negative for -), so
# the counts above use only those; in-window sources that all point the other way (or neither way) cap the
# rating at 0, shown as "capped: no recent evidence in this direction". --reuse-news re-applies all four
# caps to the archived ratings (as of the news run's date; evidence archived before the direction labels
# counts as pointing the rating's way and is listed as needing a fresh run).
news_risk:
  points_per_step: 25
  source_quality:
    strong_tiers: [primary, major]
    strong_min_verified: 1        # verified in-window sources from strong_tiers a rating above cap_without_strong needs;
    cap_without_strong: 1         # with fewer, capped at +-1 (so +-2 needs a verified primary or major source)
    cap_other_only: 1             # no source from strong_tiers (only other-tier): capped at +-1,
    cap_other_only_unverified: 0  # and at 0 when none of its sources verified
  topics:
    guidance: {weight: 0.25, label: "Guidance changes"}
    analyst_actions: {weight: 0.15, label: "Analyst actions"}
    litigation_regulation: {weight: 0.20, label: "Litigation and regulation"}
    customer_concentration: {weight: 0.10, label: "Customer concentration"}
    insider_activity: {weight: 0.10, label: "Insider activity"}
    product_competitive: {weight: 0.20, label: "Product and competitive news"}

# Composite score bands (the composite is rounded to a whole number first)
ratings:
  - {min: 80, label: "Strong Buy"}
  - {min: 65, label: "Buy"}
  - {min: 45, label: "Hold"}
  - {min: 30, label: "Sell"}
  - {min: 0, label: "Strong Sell"}

# Confidence is data quality: it starts at High and each issue below adds its points; the total sets the
# level (0 High, medium_at+ Medium, low_at+ Low). Each issue counts once (a missing factor once per factor);
# the page and email list the reasons under the label.
confidence:
  medium_at: 1
  low_at: 3
  band_edge_points: 2           # "near a band edge": the composite within this many points of a band's floor
  points:
    missing_factor: 1           # per factor with no data (6 of 6 High, 4-5 Medium, 3 or fewer Low, as before)
    missing_sub_metric: 1       # any input of a scored factor missing (listed)
    unknown_cash_debt: 1        # cash, investments or debt unknown (a tag stopped reporting)
    fcf_ex_prepayments: 1       # quality and valuation scored on FCF ex-prepayments
    fcf_spike: 1                # the FCF spike guard fired (normalised FCF)
    short_valuation_history: 1  # fewer than valuation.min_history_points month-ends
    near_band_edge: 1
    weak_sources: 1             # any news topic capped for weak sources

# Capex dashboard overlay (site/data/latest.json). Tickers below are capped at "Hold" when the capex
# level is RED and confirmed; AMBER (or unconfirmed RED) only adds a note.
overlay:
  cap_at: Hold
  stale_after_days: 14          # the note says so when the capex data is older than this
  ai_exposed: [NVDA, AMD, AVGO, MRVL, MU, TSM, MSFT, GOOGL, AMZN, META, ORCL, CRDO, ALAB, ANET, VRT, SMCI,
               DELL, CRWV]

# Latest earnings 8-K (Item 2.02) Exhibit 99.1: guidance sentences (verbatim-checked) and phrase counts
guidance:
  cautious_phrases:             # case-insensitive regex counts, also counted in the previous release
    headwind: '\bheadwinds?\b'
    uncertain: '\buncertain(ty|ties)?\b'
    softness: '\bsoft(ness|er|ening)?\b'
    challenging: '\bchalleng(ing|es)\b'
    macro: '\bmacro(economic)?\b'
    cautious: '\bcautio(us|n)\b'
    pacing: '\bpacing\b'
    digestion: '\bdigest(ion|ing)\b'
    delay: '\bdelay(s|ed)?\b'

# Evidence checks, as in the capex pipeline (cew/sources.py)
source_check:
  timeout_seconds: 10
evidence_dates:
  background_after_days: 30     # older than the news window (keep equal to news_window_days): labelled
                                # background, and no support for a non-zero topic rating
# A company's own domains are primary-tier sources for its own stock only (stocks/domains.py; any subdomain):
# SEC submissions "website" / "investorWebsite" when given (empty for all 14 below), plus `tickers`, plus a
# strict match on the cited sites: a registered domain whose second-level label is the ticker (3+
# characters) or the first word of the company name (4+ letters, not a generic word). Never another
# company's domain: a match that belongs to someone else goes under `exclude`.
company_domains:
  tickers:
    GOOGL: [abc.xyz, blog.google]
    GTLB: [gitlab.com]
    INOD: [innodata.com]
    META: [meta.com, atmeta.com, about.fb.com]
    MSFT: [microsoft.com]
    MSGS: [msgsports.com]
    NTAP: [netapp.com]
    NVDA: [nvidia.com]
    ORCL: [oracle.com]
    PLTR: [palantir.com]
    RBRK: [rubrik.com]
    SHOP: [shopify.com]
    TIC: []                     # not confirmed yet; add TIC Solutions' own domain here
    ZS: [zscaler.com]
  exclude: [shop.com, alphabet.com, madison.com]   # SHOP's ticker, Alphabet's and Madison Square Garden's first words: other owners

source_tiers:
  # the company's own domains (company_domains above) are added to primary on that ticker's runs
  primary:
    [gov, europa.eu, businesswire.com, prnewswire.com, globenewswire.com, accessnewswire.com,
     microsoft.com, abc.xyz, blog.google, aboutamazon.com, atmeta.com, about.fb.com,
     oracle.com, nvidia.com, amd.com, broadcom.com, tsmc.com, micron.com, marvell.com, arista.com,
     vertiv.com, credosemi.com, asteralabs.com, dell.com, supermicro.com, coreweave.com, apple.com, tesla.com]
  major:
    [reuters.com, bloomberg.com, cnbc.com, ft.com, wsj.com, apnews.com, nytimes.com, barrons.com,
     theinformation.com, nikkei.com, economist.com, marketwatch.com, investors.com]

email:
  subject_prefix: "[Stock]"
