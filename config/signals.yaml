# Capex Early-Warning configuration
# Edit thresholds here; no code changes needed.
# Every category is scored 0 (calm) to 3 (strong warning).

models:
  research: claude-sonnet-5-5   # web-search news research
  assessment: claude-opus-5-5   # news scoring and the digest
# A run's models come from (first valid wins): the workflow_dispatch inputs, then the repo
# Actions variables RESEARCH_MODEL / ASSESSMENT_MODEL, then the values above.
# Prices for the cost estimate live in config/models.yaml.
max_web_searches: 16            # cap on Claude web searches per run (the four topics plus follow-ups)
assessment_samples: 2           # scoring passes over the same research notes; news scores are averaged
                                # (rounded half down) and the spread between passes is recorded
assessment_unstable_spread: 2   # passes this many points apart on a news category flag it "unstable"

# Follow-ups: the previous run's "watch next" items are searched for and given a status in this run.
follow_ups:
  max_runs: 3                   # an unresolved item is followed up in at most this many runs, then drops off
  max_items: 12                 # most follow-ups passed to one run (the newest are kept)

# ---------------------------------------------------------------------------
# Data sources
# ---------------------------------------------------------------------------
fred_series:
  # Context / pressure gauges
  CPIAUCSL: {label: "CPI (headline index)", freq: monthly}
  CPILFESL: {label: "Core CPI index", freq: monthly}
  PCEPILFE: {label: "Core PCE index", freq: monthly}
  DFF: {label: "Fed funds effective rate (%)", freq: daily}
  DGS2: {label: "2-yr Treasury yield (%)", freq: daily}
  DGS10: {label: "10-yr Treasury yield (%)", freq: daily}
  T10Y2Y: {label: "10y minus 2y spread (%)", freq: daily}
  DCOILBRENTEU: {label: "Brent crude ($/bbl)", freq: daily}
  VIXCLS: {label: "VIX", freq: daily}
  # Credit (a domino category)
  BAMLH0A0HYM2: {label: "High-yield credit spread (%)", freq: daily}
  BAMLC0A0CM: {label: "Investment-grade credit spread (%)", freq: daily}
  BAA10Y: {label: "Baa corporate minus 10-yr Treasury spread (%)", freq: daily}
  # Prices for the running log (SPY / QQQ proxies)
  SP500: {label: "S&P 500 index", freq: daily}
  NASDAQ100: {label: "Nasdaq-100 index", freq: daily}

hyperscalers:
  MSFT: {cik: "0000789019", name: "Microsoft"}
  GOOGL: {cik: "0001652044", name: "Alphabet"}
  AMZN: {cik: "0001018724", name: "Amazon"}
  META: {cik: "0001326801", name: "Meta"}
  ORCL: {cik: "0001341439", name: "Oracle"}

# Taiwan AI-server supply chain (TWSE listed; monthly revenue due by the 10th)
taiwan_companies:
  "2330": "TSMC"
  "2317": "Hon Hai (Foxconn)"
  "2382": "Quanta"
  "3231": "Wistron"
  "6669": "Wiwynn"
  "2345": "Accton"
  "2376": "Gigabyte"

# ---------------------------------------------------------------------------
# Scoring thresholds (rule-based categories)
# ---------------------------------------------------------------------------
credit:
  # Change in high-yield spread over the last ~4 weeks, in percentage points
  hy_change_4w: [0.25, 0.50, 0.75]      # >= each value adds a point (1, 2, 3)
  # Absolute high-yield spread level that alone signals stress (%)
  hy_level_stress: 5.0
  ig_change_4w_bonus: 0.20              # IG spread widening this much adds +1 (capped at 3)

# Credit contagion stage: context only, it never changes the credit score. Classified each run from
# 4-week spread changes in percentage points (HY = BAMLH0A0HYM2, IG = BAMLC0A0CM, BAA = BAA10Y):
#   Calm: none widening · Junk only (contained): HY widening, IG and BAA not · Spreading: HY and IG or
#   BAA widening · IG only (financing pressure, possibly bond supply): IG or BAA widening, HY not ·
#   Easing: HY and IG both narrowing.
credit_stage:
  hy_widen: 0.40                        # 4-week change at or above this counts as widening
  ig_widen: 0.10
  baa_widen: 0.15
  hy_narrow: -0.40                      # 4-week change at or below this counts as narrowing
  ig_narrow: -0.10
  baa_narrow: -0.15
  # 10-year Treasury (DGS10) 4-week change: at or above +this is "rising" (rate/inflation pressure),
  # at or below -this is "falling" ("growth scare" when spreads are widening), otherwise "flat"
  ust10y_move: 0.10

taiwan:
  # Median year-over-year revenue growth of the AI-server group (%)
  median_yoy: [10.0, 0.0, -10.0]        # below each value adds a point
  # Drop in median YoY versus 3 months earlier (percentage points) adds +1
  decel_3m_pts: 20.0

hyperscaler_filings:
  # Aggregate quarterly capex of the five hyperscalers, quarter over quarter (%)
  agg_capex_qoq: [0.0, -5.0, -15.0]     # below each value adds a point
  single_capex_cut_pct: -10.0           # any one company cutting this much QoQ adds +1
  new_lease_assets_qoq: -25.0           # aggregate new right-of-use lease assets falling this much adds +1
  # Leases signed but not yet commenced (10-Q/10-K footnote text), aggregate quarter over quarter (%)
  leases_not_commenced_qoq: -25.0       # falling this much or more adds +1

# Claude-scored (news) categories: ai_lab_financing, supplier_signals, physical_buildout,
# plus a news adjustment to credit. Claude returns 0-3 with cited evidence.

composite:
  # Weights for the six categories in the composite score (max = 3 * sum of weights)
  weights:
    credit: 1.0
    ai_lab_financing: 1.0
    taiwan_supply_chain: 1.0
    hyperscaler_filings: 1.0
    supplier_signals: 1.0
    physical_buildout: 1.0
  amber_at: 5        # composite >= amber_at  -> AMBER
  red_at: 9          # composite >= red_at    -> RED
  # Once a run is AMBER, the next run stays AMBER until the composite falls below amber_at minus this
  # (with whole-point scores: 4 holds AMBER, 3 drops to GREEN). Same at the RED boundary (8 holds RED).
  # Rises are never delayed. Event-run emails compare this held level with the previous run's.
  level_hysteresis: 1
  single_category_alert: 3   # any one category at this score triggers an alert

# Two-run confirmation and jump flags (compared with the previous run in data/runs.csv)
confirmation:
  min_categories: 2          # RED shows as "confirmed" once this many categories...
  min_score: 2               # ...scored at least this...
  consecutive_runs: 2        # ...in this many consecutive runs (the same categories each time)
  jump_points: 2             # flag a category that rose this many points since the last run

# Evidence URL checks after the assessment (news categories)
source_check:
  timeout_seconds: 10
  cap_from: 2                # a news category scoring this or more...
  min_sources: 2             # ...needs this many verified-or-unreachable sources...
  cap_to: 1                  # ...or it is capped at this score

# Source tier of each evidence URL, by host (a listed domain also matches its subdomains; "gov" matches
# every .gov site). Anything not listed is "other". A label only: tiers don't change scores or caps.
source_tiers:
  primary:   # filings, regulators, grid operators, company IR pages, newsrooms and press-release wires
    [gov, gov.tw, europa.eu, twse.com.tw, pjm.com, ercot.com,
     microsoft.com, abc.xyz, blog.google, aboutamazon.com, atmeta.com, about.fb.com, oracle.com,
     nvidia.com, amd.com, broadcom.com, tsmc.com, micron.com, skhynix.com, vertiv.com, arista.com,
     credosemi.com, asteralabs.com, celestica.com, coreweave.com, nebius.com, openai.com, anthropic.com,
     x.ai, mistral.ai, businesswire.com, prnewswire.com, globenewswire.com]
  major:
    [reuters.com, bloomberg.com, cnbc.com, ft.com, wsj.com, apnews.com, nytimes.com, barrons.com,
     theinformation.com, nikkei.com, economist.com]

# Event dates: Claude gives every evidence item and follow-up the date it happened (not when it was
# reported), YYYY-MM-DD or null. Code drops malformed dates and dates after tomorrow; press-release evidence
# uses the 8-K filing date. Shown next to each item on the dashboard and in the email. A label only: dates
# don't change scores or caps.
evidence_dates:
  background_after_days: 10  # items that happened more than this many days before the run show "background"

# Filing text read from EDGAR (leases not yet commenced; earnings press releases)
filing_text:
  # Paragraphs about leases signed but not yet started (Oracle words it "additional lease commitments")
  lease_phrases: ["not yet commenced", "additional lease commitments"]
  # Phrases counted (case-insensitive regex) in hyperscaler earnings press releases
  call_phrases:
    pacing: '\bpacing\b'
    digestion: '\bdigest(ion|ing)\b'
    discipline: '\bdisciplin(e|ed)\b'
    optimize: '\boptimi[sz](e|es|ed|ing|ation)\b'
    capacity constrained: '\bcapacity[\s-]+constrain(ed|ts?)\b'
    fungible: '\bfungib(le|ility)\b'

email:
  send_every_week: true      # weekly digest even when calm; alerts are flagged in the subject
  # Event-day runs email only when the composite level changes or a category moves this many
  # points (up or down) versus the previous run.
  event_category_move: 2
