<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capex Early Warning</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --link: #1c5cab;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --link: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --link: #86b6ef;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--link); }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 12px; }
.sub { color: var(--ink-2); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; }
.grid { display: grid; gap: 16px; }
.hero { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 16px; margin: 20px 0 16px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.level { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; }
.big { font-size: 44px; font-weight: 650; line-height: 1.1; margin: 8px 0 4px; }
.big small { font-size: 18px; color: var(--muted); font-weight: 500; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.digest p { margin: 0 0 10px; } .digest ul { margin: 0 0 10px; padding-left: 20px; }
.cats { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); margin-bottom: 16px; }
.cat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.meter { display: flex; gap: 3px; margin: 10px 0; }
.meter span { flex: 1; height: 6px; border-radius: 3px; background: var(--grid); }
.reasons { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.reasons li { margin-bottom: 4px; }
.evidence { font-size: 13px; margin-top: 8px; }
.evidence summary { cursor: pointer; color: var(--ink-2); }
.charts { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); margin-bottom: 16px; }
.chart-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart-title b { font-size: 14px; font-weight: 600; }
.chart-title span { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chart-title { flex-wrap: wrap; margin-bottom: 6px; }
.chart { position: relative; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 8px; padding: 6px 9px; font-size: 12.5px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; opacity: 0; transition: opacity .1s; z-index: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 600; }
.scroll { overflow-x: auto; }
.tw td:nth-child(2) { text-align: left; }
.empty { color: var(--ink-2); padding: 40px 0; text-align: center; }
.errors { color: var(--muted); font-size: 12.5px; margin-top: 16px; }
.toggle { background: none; border: 1px solid var(--ring); color: var(--ink-2); border-radius: 8px;
  padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.watch { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; }
.run { margin-top: 16px; }
.run-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; }
.run-steps { font-size: 12.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.run-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 14px 0 10px; }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); min-width: 0; }
.field small { font-weight: 400; color: var(--muted); }
.run select, .run-go input, .auto-row input { font: inherit; font-size: 14px; color: var(--ink); background: var(--page);
  border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.run select:focus-visible, .run input:focus-visible, .btn:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
.run-est { font-size: 13.5px; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.run-checks { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13.5px; margin-bottom: 12px; }
.run-checks label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.run-checks input { accent-color: var(--s1); width: 16px; height: 16px; margin: 0; }
.run-go { display: flex; gap: 8px; max-width: 420px; }
.btn { font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 8px; padding: 8px 20px;
  background: var(--ink); color: var(--page); cursor: pointer; flex: none; }
.btn:disabled { opacity: .5; cursor: default; }
.run-msg { margin-top: 10px; min-height: 1.5em; }
.auto { border-top: 1px solid var(--grid); margin-top: 16px; padding-top: 14px; }
.auto h3 { font-size: 14px; margin: 0; }
.auto-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.auto-row select { flex: 1 1 240px; width: auto; }
.auto-row input { flex: 1 1 140px; }
.auto-state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.auto-state .dot { width: 8px; height: 8px; }
@media (max-width: 760px) { .run select, .run-go input, .auto-row input { font-size: 16px; } } /* no zoom-on-focus on iOS */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--ink-2);
  border: 1px solid var(--ring); border-radius: 999px; padding: 0 7px; line-height: 18px; white-space: nowrap; vertical-align: 1px; }
.badge .dot { width: 7px; height: 7px; }
.evidence li { margin-bottom: 6px; }
.ev-sum { color: var(--ink-2); }
.flag { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; font-weight: 600;
  color: var(--ink); background: color-mix(in srgb, var(--warning) 18%, transparent); border-radius: 6px; padding: 2px 8px; }
.conf { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
td.wrap { white-space: normal; min-width: 130px; text-align: left; }
th.left, td.left { text-align: left; }
.lvl { display: inline-flex; align-items: center; gap: 6px; }
.lvl .dot { width: 8px; height: 8px; }
.mtd { font-size: 13px; color: var(--ink-2); }
.mtd b { color: var(--ink); font-size: 15px; }
.events-next { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
.tier { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin-left: 4px; white-space: nowrap; }
.tier.primary, .tier.major { color: var(--ink-2); }
.stage { margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.stage b { color: var(--ink); font-weight: 600; }
.fu { margin: 8px 0 12px; padding-left: 0; list-style: none; font-size: 13.5px; }
.fu li { margin-bottom: 6px; }
.fu .note { color: var(--ink-2); }
.held { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
.when { font-size: 12px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: 4px; }
.when.undated { font-weight: 400; color: var(--muted); }
.bg { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px dashed var(--axis); border-radius: 4px;
  padding: 0 5px; margin-left: 4px; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Capex Early Warning</h1>
      <div class="sub" id="asof">Loading…</div>
    </div>
    <button class="toggle" id="theme" type="button">Theme</button>
  </header>
  <div id="app"></div>
  <section class="card run" id="run" hidden></section>
  <p class="sub" style="margin-top:28px">Automated research summary (weekly, plus the morning after listed events) from public data (FRED, SEC EDGAR, TWSE) and Claude news research. Not investment advice.</p>
</main>

<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  // theme toggle (persisted per viewer, optional)
  const themeBtn = $("#theme");
  try { const t = localStorage.getItem("cew-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  themeBtn.onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("cew-theme", next); } catch (e) {}
    render();
  };

  const LEVEL = {
    GREEN: { color: "--good", icon: "●", label: "Green — no material warning" },
    AMBER: { color: "--warning", icon: "▲", label: "Amber — warning signs building" },
    RED: { color: "--critical", icon: "■", label: "Red — multiple warnings" },
  };
  const CATS = ["credit", "ai_lab_financing", "taiwan_supply_chain", "hyperscaler_filings", "supplier_signals", "physical_buildout"];
  const LEVEL_DOT = { GREEN: "--good", AMBER: "--warning", RED: "--critical" };
  const BADGE = {
    verified: ["--good", "verified", "The page contains the claim's numbers and names"],
    unverified: ["--warning", "unverified", "The page loaded but the claim's numbers or names were not found"],
    unreachable: ["--muted", "unreachable", "The page could not be fetched (paywall, block, timeout or not a web page)"],
  };
  const TIER_TITLE = {
    primary: "Primary source: filing, regulator, grid operator or company IR / press release",
    major: "Major outlet (Reuters, Bloomberg, CNBC, FT, WSJ and similar)",
    other: "Other source (aggregator, trade site, blog or forum)",
  };
  const FOLLOW = {
    resolved: ["--s1", "resolved"], improved: ["--good", "improved"], worsened: ["--critical", "worsened"],
    still_open: ["--warning", "still open"], no_news: ["--muted", "no news"],
  };
  const SCORE_COLOR = ["--good", "--warning", "--serious", "--critical"];
  const SCORE_LABEL = ["Calm", "Weak signal", "Several signals", "Strong warning"];

  // Minimal, safe Markdown: escape first, then bold/italic/links/lists/paragraphs.
  function md(src) {
    const lines = esc(src || "").split(/\n/);
    let out = "", inList = false, para = [];
    const inline = s => s
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const flush = () => { if (para.length) { out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
    for (const raw of lines) {
      const l = raw.trim();
      const m = l.match(/^[-*]\s+(.*)/);
      if (m) { flush(); if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
      if (inList) { out += "</ul>"; inList = false; }
      if (!l) { flush(); continue; }
      para.push(l.replace(/^#+\s*/, ""));
    }
    flush(); if (inList) out += "</ul>";
    return out;
  }

  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const fmt = (v, d = 2) => v == null || isNaN(v) ? "—" : Number(v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
  const fmtB = v => v == null ? "—" : "$" + (v / 1e9).toFixed(1) + "B";
  const signed = (v, d = 1) => v == null ? "—" : (v > 0 ? "+" : "") + Number(v).toFixed(d);
  const usd = v => v == null || isNaN(v) ? "—" : "$" + (v > 0 && v < 0.01 ? Number(v).toFixed(4) : Number(v).toFixed(2));
  const perM = v => "$" + (v < 1 ? Number(v).toFixed(2) : String(+Number(v).toFixed(2)));
  const short = id => String(id || "").replace(/^claude-/, "");
  const runTime = ts => ts ? String(ts).slice(0, 16).replace("T", " ") + " UTC" : "";
  const shortDate = d => d ? `${MONTHS[+d.slice(5, 7) - 1]} ${+d.slice(8, 10)}` : "";
  const triggerLabel = t => !t || t === "schedule" ? "weekly run" : t === "manual" ? "manual run"
    : t.startsWith("event:") ? "event: " + t.slice(6).split("+").join(", ") : t;
  const badge = (st, title) => BADGE[st] ? `<span class="badge" title="${esc(title || BADGE[st][2])}"><i class="dot" style="background:var(${BADGE[st][0]})"></i>${BADGE[st][1]}</span>` : "";
  const tierTag = t => TIER_TITLE[t] ? `<span class="tier ${t}" title="${esc(TIER_TITLE[t])}">${t}</span>` : "";
  const hostOf = u => (String(u || "").match(/^https?:\/\/(?:www\.)?([^/]+)/) || [])[1] || "link";
  // Event date (when it happened, not when it was reported); "background" when well before the run.
  // Runs from before event dates have no event_date key and show nothing.
  const when = (e, year) => !("event_date" in e) ? ""
    : !e.event_date ? '<span class="when undated" title="The source does not say when it happened">undated</span>'
    : `<time class="when" datetime="${esc(e.event_date)}" title="When it happened (event date)">${esc(shortDate(e.event_date) + (e.event_date.slice(0, 4) === year ? "" : ", " + e.event_date.slice(0, 4)))}</time>` +
      (e.background ? `<span class="bg" title="${esc(`Happened ${e.age_days} days before this run: context, not this week's news`)}">background</span>` : "");
  const lvlDot = l => `<span class="lvl"><span class="dot" style="background:var(${LEVEL_DOT[l] || "--muted"})"></span>${esc(l || "—")}</span>`;
  const upcoming = () => {
    const today = new Date().toISOString().slice(0, 10);
    return ((state.runs || {}).upcoming_events || []).filter(e => e.date >= today);
  };

  // ---------------------------------------------------------------- charts
  function niceTicks(lo, hi, n = 4) {
    if (lo === hi) { lo -= 1; hi += 1; }
    const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
    const start = Math.floor(lo / step) * step, ticks = [];
    for (let v = start; v <= hi + step * 0.5; v += step) ticks.push(+v.toFixed(10));
    ticks.dec = step >= 1 ? 0 : Math.min(3, Math.ceil(-Math.log10(step) - 1e-9));
    return ticks;
  }

  function attachTip(wrap) {
    const tip = document.createElement("div"); tip.className = "tip"; wrap.appendChild(tip); return tip;
  }
  function placeTip(tip, wrap, x, y, html) {
    tip.innerHTML = html; tip.style.opacity = 1;
    const w = tip.offsetWidth, W = wrap.clientWidth;
    tip.style.left = Math.min(Math.max(0, x - w / 2), W - w) + "px";
    tip.style.top = Math.max(0, y - tip.offsetHeight - 12) + "px";
  }

  // Single-series line with crosshair + tooltip. pts: [[dateStr, value], ...]
  function lineChart(el, pts, unit) {
    el.innerHTML = "";
    if (!pts || pts.length < 2) { el.innerHTML = '<div class="sub">Not enough data yet.</div>'; return; }
    const W = Math.max(260, el.clientWidth || 340), H = 150, m = { l: 44, r: 8, t: 8, b: 22 };
    const xs = pts.map(p => new Date(p[0]).getTime()), ys = pts.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
    const y0 = ticks[0], y1 = ticks[ticks.length - 1];
    const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r);
    const Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
    let g = "";
    for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${css("--grid")}" stroke-width="1"/>` +
      `<text class="tick" x="${m.l - 6}" y="${Y(t) + 3.5}" text-anchor="end">${fmt(t, ticks.dec)}</text>`;
    const years = [...new Set(pts.map(p => p[0].slice(0, 4)))];
    for (const yr of years) {
      const t = new Date(yr + "-01-01").getTime();
      if (t > x0 && t < x1) g += `<text class="tick" x="${X(t)}" y="${H - 6}" text-anchor="middle">${yr}</text>`;
    }
    const d = pts.map((p, i) => (i ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
    const last = pts[pts.length - 1];
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="line chart">${g}
      <line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="${css("--axis")}"/>
      <path d="${d}" fill="none" stroke="${css("--s1")}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(xs[xs.length - 1])}" cy="${Y(last[1])}" r="4" fill="${css("--s1")}" stroke="${css("--surface")}" stroke-width="2"/>
      <line class="xh" y1="${m.t}" y2="${H - m.b}" stroke="${css("--muted")}" stroke-width="1" opacity="0"/>
      <circle class="hp" r="4" fill="${css("--s1")}" stroke="${css("--surface")}" stroke-width="2" opacity="0"/>
      <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" class="hit"/></svg>`;
    const svg = $("svg", el), tip = attachTip(el), xh = $(".xh", el), hp = $(".hp", el);
    const move = ev => {
      const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W;
      const t = x0 + (sx - m.l) / (W - m.l - m.r) * (x1 - x0);
      let i = 0, best = Infinity; xs.forEach((v, j) => { const dd = Math.abs(v - t); if (dd < best) { best = dd; i = j; } });
      const cx = X(xs[i]), cy = Y(ys[i]);
      xh.setAttribute("x1", cx); xh.setAttribute("x2", cx); xh.setAttribute("opacity", 1);
      hp.setAttribute("cx", cx); hp.setAttribute("cy", cy); hp.setAttribute("opacity", 1);
      placeTip(tip, el, cx / W * r.width, cy / H * r.height, `<b>${fmt(ys[i], 2)}${unit || ""}</b><br><span class="sub">${pts[i][0]}</span>`);
    };
    const leave = () => { tip.style.opacity = 0; xh.setAttribute("opacity", 0); hp.setAttribute("opacity", 0); };
    $(".hit", el).addEventListener("pointermove", move);
    $(".hit", el).addEventListener("pointerleave", leave);
  }

  // Bars around a zero baseline (single series). data: [[label, value], ...]
  function barChart(el, data, unit) {
    el.innerHTML = "";
    if (!data.length) { el.innerHTML = '<div class="sub">Builds up month by month as Taiwan revenue is published.</div>'; return; }
    const W = Math.max(260, el.clientWidth || 340), H = 150, m = { l: 44, r: 8, t: 8, b: 22 };
    const vals = data.map(d => d[1]);
    const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals));
    const y0 = ticks[0], y1 = ticks[ticks.length - 1];
    const Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
    const bw = (W - m.l - m.r) / data.length, gap = Math.min(6, bw * 0.3);
    let g = "";
    for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${css("--grid")}"/>` +
      `<text class="tick" x="${m.l - 6}" y="${Y(t) + 3.5}" text-anchor="end">${fmt(t, 0)}${unit}</text>`;
    data.forEach((d, i) => {
      const x = m.l + i * bw + gap / 2, w = bw - gap, top = Y(Math.max(0, d[1])), bot = Y(Math.min(0, d[1]));
      const r = Math.min(4, w / 2, (bot - top) / 2);
      // rounded at the data end only
      const path = d[1] >= 0
        ? `M${x} ${bot}V${top + r}Q${x} ${top} ${x + r} ${top}H${x + w - r}Q${x + w} ${top} ${x + w} ${top + r}V${bot}Z`
        : `M${x} ${top}V${bot - r}Q${x} ${bot} ${x + r} ${bot}H${x + w - r}Q${x + w} ${bot} ${x + w} ${bot - r}V${top}Z`;
      g += `<path d="${path}" fill="${css("--s1")}" data-i="${i}" class="bar"/>`;
      const every = Math.max(1, Math.ceil(data.length / Math.floor((W - m.l - m.r) / 44)));
      if ((data.length - 1 - i) % every === 0)
        g += `<text class="tick" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${MONTHS[+d[0].slice(5, 7) - 1]} ${d[0].slice(2, 4)}</text>`;
    });
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="${css("--axis")}"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="bar chart">${g}</svg>`;
    const svg = $("svg", el), tip = attachTip(el);
    el.querySelectorAll(".bar").forEach(b => {
      b.addEventListener("pointerenter", () => {
        const i = +b.dataset.i, bb = b.getBBox(), r = svg.getBoundingClientRect();
        b.setAttribute("opacity", 0.8);
        placeTip(tip, el, (bb.x + bb.width / 2) / W * r.width, bb.y / H * r.height,
          `<b>${signed(data[i][1])}${unit}</b><br><span class="sub">${data[i][0]}</span>`);
      });
      b.addEventListener("pointerleave", () => { b.removeAttribute("opacity"); tip.style.opacity = 0; });
    });
  }

  // Stacked bars: capex by calendar quarter, one segment per company, fixed slot order.
  function stackedBars(el, buckets, tickers, names) {
    el.innerHTML = "";
    // skip quarters only partly reported (e.g. Oracle's offset fiscal quarter lands first)
    const qs = Object.keys(buckets).filter(q => Object.keys(buckets[q]).length >= Math.min(3, tickers.length)).slice(-10);
    if (!qs.length) { el.innerHTML = '<div class="sub">No filings data yet.</div>'; return; }
    const slots = ["--s1", "--s2", "--s3", "--s4", "--s5"];
    const W = Math.max(300, el.clientWidth || 680), H = 220, m = { l: 52, r: 8, t: 8, b: 22 };
    const totals = qs.map(q => tickers.reduce((s, t) => s + (buckets[q][t] || 0), 0) / 1e9);
    const ticks = niceTicks(0, Math.max(...totals));
    const y1 = ticks[ticks.length - 1];
    const Y = v => H - m.b - v / y1 * (H - m.t - m.b);
    const bw = (W - m.l - m.r) / qs.length, gap = Math.min(14, bw * 0.35);
    let g = "";
    for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${css("--grid")}"/>` +
      `<text class="tick" x="${m.l - 6}" y="${Y(t) + 3.5}" text-anchor="end">$${fmt(t, 0)}B</text>`;
    qs.forEach((q, i) => {
      const x = m.l + i * bw + gap / 2, w = bw - gap;
      let acc = 0;
      const present = tickers.filter(t => buckets[q][t]);
      present.forEach((t, k) => {
        const v = buckets[q][t] / 1e9, top = Y(acc + v), bot = Y(acc);
        const isTop = k === present.length - 1, r = isTop ? Math.min(4, w / 2) : 0;
        const h = Math.max(0, bot - top - (k ? 2 : 0)); // 2px surface gap between segments
        const yTop = bot - (k ? 2 : 0) - h;
        const path = r ? `M${x} ${yTop + h}V${yTop + r}Q${x} ${yTop} ${x + r} ${yTop}H${x + w - r}Q${x + w} ${yTop} ${x + w} ${yTop + r}V${yTop + h}Z`
          : `M${x} ${yTop + h}V${yTop}H${x + w}V${yTop + h}Z`;
        g += `<path d="${path}" fill="${css(slots[tickers.indexOf(t) % slots.length])}" class="seg" data-q="${q}"/>`;
        acc += v;
      });
      const every = Math.max(1, Math.ceil(qs.length / Math.floor((W - m.l - m.r) / 58)));
      if ((qs.length - 1 - i) % every === 0)
        g += `<text class="tick" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${q.replace("Q", " Q")}</text>`;
      g += `<rect x="${m.l + i * bw}" y="${m.t}" width="${bw}" height="${H - m.t - m.b}" fill="transparent" class="col" data-i="${i}"/>`;
    });
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="${css("--axis")}"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="stacked bar chart">${g}</svg>`;
    const svg = $("svg", el), tip = attachTip(el);
    el.querySelectorAll(".col").forEach(c => {
      c.addEventListener("pointerenter", () => {
        const i = +c.dataset.i, q = qs[i], r = svg.getBoundingClientRect();
        el.querySelectorAll(".seg").forEach(s => s.setAttribute("opacity", s.dataset.q === q ? 1 : 0.45));
        const rows = tickers.filter(t => buckets[q][t]).map(t =>
          `<i class="dot" style="background:var(${slots[tickers.indexOf(t)]});width:8px;height:8px"></i> ${esc(names[t] || t)}: ${fmtB(buckets[q][t])}`).join("<br>");
        placeTip(tip, el, (m.l + (i + 0.5) * bw) / W * r.width, Y(totals[i]) / H * r.height,
          `<b>${q} · ${fmtB(totals[i] * 1e9)}</b><br>${rows}`);
      });
      c.addEventListener("pointerleave", () => { tip.style.opacity = 0; el.querySelectorAll(".seg").forEach(s => s.removeAttribute("opacity")); });
    });
    const legend = document.createElement("div"); legend.className = "legend";
    legend.innerHTML = tickers.map(t => `<span><i style="background:var(${slots[tickers.indexOf(t)]})"></i>${esc(names[t] || t)}</span>`).join("");
    el.appendChild(legend);
  }

  const CACHE_W = 1.25, CACHE_R = 0.1; // prompt-cache multipliers, as in cew/models.py

  function stepCost(u, price, wsPer1k) {
    if (!u || !price) return null;
    const input = (u.input_tokens || 0) + (u.cache_write_tokens || 0) * CACHE_W + (u.cache_read_tokens || 0) * CACHE_R;
    return (input * price.input + (u.output_tokens || 0) * price.output) / 1e6 + (u.web_searches || 0) * wsPer1k / 1000;
  }

  function optionLabel(m, isDefault, research) {
    const bits = [m.display_name || m.id, m.price ? `${perM(m.price.input)} / ${perM(m.price.output)}` : "no price"];
    if (m.price && m.price.verify) bits.push("verify price");
    if (research && m.supports_web_search == null) bits.push("web search support unknown");
    if (isDefault) bits.push("weekly default");
    return bits.join(" · ");
  }

      <div class="run-go">
        <input type="password" id="run-pass" placeholder="Passcode" autocomplete="off" aria-label="Passcode">
        <button type="button" class="btn" id="run-btn">Run</button>
      </div>
      <div class="sub run-msg" id="run-msg" role="status" aria-live="polite"></div>
      <div class="auto" id="auto" hidden>
        <div class="run-head"><h3>Automatic runs</h3><span class="auto-state" id="auto-state"></span></div>
        <div class="sub" style="margin-top:4px">Saturday runs and the morning-after-event runs each cost about the "Last run" amount above. Manual runs from this panel always work.</div>
        <div class="auto-row">
          <select id="auto-mode" aria-label="Automatic runs">
            <option value="all">On: Saturdays and event days</option>
            <option value="weekly">Saturdays only</option>
            <option value="events">Event days only</option>
            <option value="off">Paused: manual runs only</option>
          </select>
          <input type="password" id="auto-pass" placeholder="Passcode" autocomplete="off" aria-label="Passcode for automatic runs">
          <button type="button" class="btn" id="auto-btn">Save</button>
        </div>
        <div class="sub run-msg" id="auto-msg" role="status" aria-live="polite"></div>
      </div>`;
    $("#auto-btn").onclick = saveAuto;
    $("#auto-pass").onkeydown = e => { if (e.key === "Enter") saveAuto(); };
    $("#run-research").onchange = $("#run-assessment").onchange = updateEstimate;
    $("#run-btn").onclick = startRun;
    $("#run-pass").onkeydown = e => { if (e.key === "Enter") startRun(); };
    el.hidden = false;
  }

  function updateRunPanel() {
    if (!$("#run-btn")) buildRunPanel();
    const cat = state.models || {}, list = catalog(), defs = cat.defaults || {};
    fillSelect($("#run-research"), list.filter(m => m.supports_web_search !== false), true, defs.research);
    fillSelect($("#run-assessment"), list, false, defs.assessment);

    const L = state.latest || {}, claude = L.claude || {}, cost = L.cost;
    const used = claude.models || (claude.model ? { research: claude.model, assessment: claude.model } : null);
    let last = "No run yet";
    if (L.date && (!claude.enabled || !used)) last = `Last run (${esc(L.date)}): Claude step skipped`;
    else if (used) {
      const unpriced = cost && (cost.unpriced_steps || []).length ? " (a model had no price)" : "";
      last = `Last run used: ${esc(modelName(used.research))} / ${esc(modelName(used.assessment))}, ` +
        `cost ${cost ? `<b>${usd(cost.total_usd)}</b>${unpriced}` : "not recorded"}`;
    }
    $("#run-last").innerHTML = last;
    $("#run-steps").innerHTML = cost && cost.steps ? Object.entries(cost.steps).map(([k, u]) =>
      `${esc(STEP_LABEL[k] || k)}: ${fmt(u.input_tokens, 0)} in / ${fmt(u.output_tokens, 0)} out tokens` +
      `${u.web_searches ? ` · ${u.web_searches} searches` : ""} · ${usd(u.cost_usd)}`).join("<br>") : "";
    if (!list.length && !polling) $("#run-msg").textContent = "The model list appears after the next run; until then a run uses the configured defaults.";
    updateEstimate();
  }

  function updateEstimate() {
    const el = $("#run-est"), cost = (state.latest || {}).cost;
    if (!catalog().length) { el.textContent = ""; return; }
    const ws = state.models.web_search_per_1k ?? 10, price = id => (findModel(id) || {}).price;
    const units = `<div class="sub">Prices are $ per million input / output tokens, plus ${perM(ws)} per 1,000 web searches.</div>`;
    if (!cost || !cost.steps) { el.innerHTML = '<span class="sub">A cost estimate appears after the first run that records token usage.</span>' + units; return; }
    const r = stepCost(cost.steps.research, price($("#run-research").value), ws);
    const a = stepCost(cost.steps.assessment, price($("#run-assessment").value), ws);
    el.innerHTML = (r == null || a == null
      ? 'Estimated cost per run: <span class="sub">unknown (a selected model has no price in config/models.yaml)</span>'
      : `Estimated cost per run: <b>~${usd(r + a)}</b> <span class="sub">· last run's token counts × selected prices</span>`) + units;
  }

  const AUTO_TEXT = { all: ["On", "--good"], weekly: ["Saturdays only", "--warning"],
    events: ["Event days only", "--warning"], off: ["Paused", "--muted"] };

  function showAuto() {
    const box = $("#auto");
    if (!box) return;
    if (!state.auto) { box.hidden = true; return; }
    const [txt, col] = AUTO_TEXT[state.auto] || AUTO_TEXT.all;
    $("#auto-state").innerHTML = `<span class="dot" style="background:var(${col})"></span>${txt}`;
    if (document.activeElement !== $("#auto-mode")) $("#auto-mode").value = state.auto;
    box.hidden = false;
  }

  async function loadAuto() {
    const r = await fetch("api/run?auto", { cache: "no-store" }).then(x => x.ok ? x.json() : null).catch(() => null);
    state.auto = r && r.auto_runs ? r.auto_runs : null;
    showAuto();
    render();
  }

  async function saveAuto() {
    const pass = $("#auto-pass"), btn = $("#auto-btn"), msg = $("#auto-msg"), value = $("#auto-mode").value;
    if (!pass.value) { msg.textContent = "Enter the passcode."; pass.focus(); return; }
    btn.disabled = true;
    msg.textContent = "Saving…";
    let res = null, data = {};
    try {
      res = await fetch("api/run", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ passcode: pass.value, action: "set_auto", auto_runs: value }),
      });
      data = await res.json().catch(() => ({}));
    } catch (e) { /* network error */ }
    btn.disabled = false;
    if (!res || !res.ok) { msg.textContent = data.error || (res ? `Request failed (HTTP ${res.status})` : "Network error"); return; }
    pass.value = "";
    state.auto = data.auto_runs;
    msg.textContent = data.auto_runs === "off"
      ? "Saved. No automatic runs until you switch them back on."
      : "Saved. Takes effect from the next scheduled check.";
    showAuto();
    render();
  }

  async function startRun() {
    if (polling) return;
    const pass = $("#run-pass"), btn = $("#run-btn"), msg = $("#run-msg");
    if (!pass.value) { msg.textContent = "Enter the passcode."; pass.focus(); return; }
    btn.disabled = true;
    msg.textContent = "Starting…";
    let res = null, data = {};
    try {
      res = await fetch("api/run", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          passcode: pass.value, research_model: $("#run-research").value, assessment_model: $("#run-assessment").value,
          send_email: $("#run-email").checked, save_as_default: $("#run-default").checked,
        }),
      });
      data = await res.json().catch(() => ({}));
    } catch (e) { /* network error */ }
    if (!res || !res.ok) {
      msg.textContent = data.error || (res ? `Request failed (HTTP ${res.status})` : "Network error");
      btn.disabled = false;
      return;
    }
    pass.value = "";
    msg.innerHTML = `Run started · <a href="${esc(data.run_url)}" target="_blank" rel="noopener">view on GitHub</a> · <span id="run-live">queued</span>`;
    pollRun();
  }

  async function pollRun() {
    polling = true;
    const live = t => { const el = $("#run-live"); if (el) el.textContent = t; };
    const before = state.latest ? state.latest.generated_at || state.latest.date : null;
    const t0 = Date.now();
    let sawActive = false, finished = null;
    // GET /api/run reports the latest run; until ours is listed that may be the previous, finished one.
    while (Date.now() - t0 < 45 * 60e3) {
      await wait(10000);
      const s = await fetch("api/run", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
      if (!s || !s.status) continue;
      if (s.status !== "completed") { sawActive = true; live(s.status.replace(/_/g, " ")); continue; }
      if (sawActive || Date.now() - t0 > 3 * 60e3) { finished = s.conclusion || "done"; break; }
    }
    live(finished ? `finished: ${finished} · waiting for the dashboard to redeploy…` : "still not finished; check GitHub");
    if (finished) {
      for (let i = 0; i < 36; i++) { // the workflow commits the data, then Vercel redeploys (~1-3 min)
        await wait(10000);
        const L = await get("data/latest.json");
        if (L && (L.generated_at || L.date) !== before) {
          await loadAll();
          live(`finished: ${finished} · dashboard updated`);
          break;
        }
        if (i === 35) live(`finished: ${finished} · no new data yet; refresh in a few minutes`);
      }
    }
    polling = false;
    $("#run-btn").disabled = false;
  }

  const get = u => fetch(u + "?v=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null);
  function loadAll() {
    return Promise.all([get("data/latest.json"), get("data/charts.json"), get("data/log.json"), get("data/models.json"), get("data/runs.json")])
      .then(([latest, charts, log, models, runs]) => {
        state = { latest, charts: charts || {}, log: log || [], models, runs: runs || {}, auto: state ? state.auto : null };
        render();
        updateRunPanel();
        showAuto();
      });
  }
  loadAll().then(loadAuto);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  let rt; let lastW = innerWidth;
  addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(render, 150); });
})();
</script>
</body>
</html>
